<style>
  #fishos-root {
    --teal-950: #0E2B2E;
    --teal-800: #164E52;
    --teal-600: #1F7A80;
    --teal-500: #2C9AA0;
    --cream: #F5F1E8;
    --cream-card: #FFFFFF;
    --ink: #17221F;
    --ink-soft: #4B5A56;
    --amber: #D98E2B;
    --amber-bg: #FBEDD5;
    --red: #C1443C;
    --red-bg: #F9E1DF;
    --green: #3E7A52;
    --green-bg: #E3F0E5;
    --line: #DCD5C4;
    font-family: 'IBM Plex Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100%;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  #fishos-root * { box-sizing: border-box; }
  #fishos-root .mono { font-family: 'IBM Plex Mono', 'SF Mono', Consolas, monospace; letter-spacing: 0.01em; }
  #fishos-root button { font-family: inherit; cursor: pointer; }
  #fishos-root input, #fishos-root select, #fishos-root textarea { font-family: inherit; font-size: 16px; }

  .fo-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--cream); display: flex; flex-direction: column; }

  /* ---- header ---- */
  .fo-header { background: var(--teal-950); color: var(--cream); padding: 14px 16px; position: sticky; top: 0; z-index: 20; }
  .fo-header-top { display: flex; align-items: center; justify-content: space-between; }
  .fo-title { font-size: 18px; font-weight: 700; letter-spacing: 0.01em; }
  .fo-sub { font-size: 11.5px; color: #9FC4C6; margin-top: 1px; }
  .fo-header-icons { display: flex; align-items: center; gap: 6px; }
  .fo-icon-btn {
    background: rgba(255,255,255,0.09); border: none; color: var(--cream); width: 34px; height: 34px;
    border-radius: 8px; font-size: 15px; display: flex; align-items: center; justify-content: center;
  }
  .fo-icon-btn:active { background: rgba(255,255,255,0.2); }
  .fo-header-row2 { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .fo-role-toggle { display: flex; background: rgba(255,255,255,0.08); border-radius: 8px; padding: 3px; }
  .fo-role-toggle button { border: none; background: transparent; color: #9FC4C6; font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 6px; }
  .fo-role-toggle button.active { background: var(--teal-500); color: white; }
  .fo-user-chip { margin-left: auto; font-size: 11.5px; color: #9FC4C6; text-align: right; line-height: 1.35; }
  .fo-user-chip b { color: var(--cream); font-weight: 700; }
  .fo-sync-note { font-size: 10.5px; color: #7FA9AB; margin-top: 8px; }

  .fo-body { flex: 1; padding: 16px; padding-bottom: 40px; }

  /* ---- login screen ---- */
  .fo-login-wrap { padding: 30px 20px; }
  .fo-login-title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 4px; }
  .fo-login-sub { font-size: 13.5px; color: var(--ink-soft); text-align: center; margin-bottom: 28px; }
  .fo-role-cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .fo-role-card {
    background: var(--cream-card); border: 1.5px solid var(--line); border-radius: 10px; padding: 16px;
    text-align: left; display: flex; flex-direction: column; gap: 2px;
  }
  .fo-role-card.selected { border-color: var(--teal-600); background: #EAF4F3; }
  .fo-role-card .fo-role-name { font-size: 15.5px; font-weight: 700; }
  .fo-role-card .fo-role-desc { font-size: 12.5px; color: var(--ink-soft); }
  .fo-login-form { margin-top: 6px; }
  .fo-pin-dots { display: flex; gap: 10px; justify-content: center; margin: 6px 0 18px; }
  .fo-pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--teal-600); }
  .fo-pin-dot.filled { background: var(--teal-600); }
  .fo-login-error { color: var(--red); font-size: 13px; text-align: center; margin-top: -8px; margin-bottom: 12px; }

  /* ---- worker home grid ---- */
  .fo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .fo-tile { background: var(--cream-card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 96px; position: relative; box-shadow: 0 1px 0 rgba(23,34,31,0.04); }
  .fo-tile:active { transform: scale(0.98); background: #FBF9F3; }
  .fo-tile .fo-tile-num { font-size: 11px; color: var(--teal-600); font-weight: 700; }
  .fo-tile .fo-tile-verb { font-size: 17px; font-weight: 700; color: var(--ink); }
  .fo-tile .fo-tile-meta { font-size: 12px; color: var(--ink-soft); margin-top: auto; }
  .fo-tile .fo-badge { position: absolute; top: 12px; right: 12px; width: 9px; height: 9px; border-radius: 50%; }
  .fo-tile .fo-badge.red { background: var(--red); }
  .fo-tile .fo-badge.amber { background: var(--amber); }

  .fo-section-label { font-size: 12.5px; font-weight: 700; color: var(--teal-600); text-transform: uppercase; letter-spacing: 0.06em; margin: 22px 0 8px; }
  .fo-section-label:first-child { margin-top: 0; }

  /* ---- flow screen ---- */
  .fo-flow-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .fo-back { background: none; border: none; color: var(--teal-600); font-size: 22px; padding: 4px 8px 4px 0; line-height: 1; }
  .fo-flow-title { font-size: 20px; font-weight: 700; }

  .fo-step { background: var(--cream-card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 14px; }
  .fo-step-label { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .fo-step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--teal-800); color: white; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .fo-step-name { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); }
  .fo-step-hint { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin-top: -4px; margin-bottom: 10px; }

  .fo-scan-search { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; margin-bottom: 10px; background: var(--cream); }
  .fo-scan-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .fo-scan-item { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: white; text-align: left; }
  .fo-scan-item.selected { border-color: var(--teal-600); background: #EAF4F3; }
  .fo-scan-item .fo-scan-id { font-size: 14.5px; font-weight: 700; }
  .fo-scan-item .fo-scan-detail { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .fo-field { margin-bottom: 12px; }
  .fo-field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .fo-field input, .fo-field select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--cream); }
  .fo-field-row { display: flex; gap: 10px; }
  .fo-field-row .fo-field { flex: 1; }

  .fo-submit { width: 100%; padding: 15px; border: none; border-radius: 9px; background: var(--teal-600); color: white; font-size: 15.5px; font-weight: 700; margin-top: 4px; letter-spacing: 0.01em; }
  .fo-submit:disabled { background: #C7C0AE; }
  .fo-submit.secondary { background: var(--teal-800); }
  .fo-submit.ghost { background: transparent; color: var(--teal-600); border: 1.5px solid var(--teal-600); }

  .fo-result { text-align: center; padding: 30px 16px; }
  .fo-result-icon { font-size: 40px; margin-bottom: 10px; }
  .fo-result-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .fo-result-detail { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .fo-result-detail .warn { color: var(--red); font-weight: 700; }
  .fo-result button { margin-top: 22px; }

  .fo-pill { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.02em; }
  .fo-pill.ok { background: var(--green-bg); color: var(--green); }
  .fo-pill.amber { background: var(--amber-bg); color: var(--amber); }
  .fo-pill.red { background: var(--red-bg); color: var(--red); }
  .fo-pill.neutral { background: #EDE9DC; color: var(--ink-soft); }
  .fo-pill.role-worker { background: #E4EEF0; color: var(--teal-800); }
  .fo-pill.role-manager { background: #EFE3D0; color: #8A5A1E; }
  .fo-pill.role-founder { background: #EAE2F1; color: #5A3E8A; }

  /* ---- manager view ---- */
  .fo-mgr-date { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }
  .fo-check-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .fo-check-row:last-child { border-bottom: none; }
  .fo-check-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
  .fo-check-text { font-size: 14.5px; flex: 1; }
  .fo-check-text .fo-count { color: var(--ink-soft); font-size: 12.5px; }

  .fo-exception-card { background: white; border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
  .fo-exception-card.red { border-left-color: var(--red); }
  .fo-exception-title { font-size: 14px; font-weight: 700; }
  .fo-exception-detail { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }

  .fo-empty { text-align: center; padding: 24px; color: var(--ink-soft); font-size: 13.5px; }

  .fo-tank-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .fo-tank-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; color: var(--ink-soft); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .fo-tank-table td { padding: 9px 8px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .fo-tank-table tr:last-child td { border-bottom: none; }

  .fo-loading { text-align: center; padding: 60px 20px; color: var(--ink-soft); }

  /* ---- activity log ---- */
  .fo-activity-filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .fo-filter-btn { flex: 1; padding: 9px; border-radius: 8px; border: 1.5px solid var(--line); background: white; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .fo-filter-btn.active { border-color: var(--teal-600); background: var(--teal-600); color: white; }
  .fo-activity-item { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; margin-bottom: 7px; }
  .fo-activity-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .fo-activity-actor { font-size: 13px; font-weight: 700; }
  .fo-activity-time { font-size: 11px; color: var(--ink-soft); }
  .fo-activity-summary { font-size: 13px; color: var(--ink); }

  /* ---- settings ---- */
  .fo-settings-block { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .fo-settings-label { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .fo-settings-desc { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; line-height: 1.5; }
  .fo-code-block { background: var(--teal-950); color: #C9E6E4; font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 12px; border-radius: 8px; overflow-x: auto; white-space: pre; line-height: 1.6; margin-bottom: 8px; }
  .fo-sync-status { font-size: 12px; margin-top: 8px; }
  .fo-sync-status.ok { color: var(--green); }
  .fo-sync-status.err { color: var(--red); }
</style>

<div id="fishos-root">
  <div class="fo-shell">
    <div class="fo-header" id="fo-header"></div>
    <div class="fo-body" id="fo-body">
      <div class="fo-loading">Loading facility data…</div>
    </div>
  </div>
</div>

<script>
(function(){

// ---------------------------------------------------------------------
// CONSTANTS
// ---------------------------------------------------------------------
const STAGE_BANDS = {
  Tilapia: [
    { stage: 'Fingerling', min: 0,     max: 0.11 },
    { stage: 'Juvenile',   min: 0.11,  max: 0.55 },
    { stage: 'Grow-Out',   min: 0.55,  max: 2.0  },
    { stage: 'Harvest Ready', min: 2.0, max: Infinity },
  ],
  Catfish: [
    { stage: 'Fingerling', min: 0,     max: 0.165 },
    { stage: 'Juvenile',   min: 0.165, max: 0.99  },
    { stage: 'Grow-Out',   min: 0.99,  max: 3.0   },
    { stage: 'Harvest Ready', min: 3.0, max: Infinity },
  ],
};
const FCR_TARGET = { Tilapia: [1.2, 1.4], Catfish: [1.5, 1.7] };
const TEMP_BAND = { Tilapia: [78, 86], Catfish: [75, 82] };
const PURGE_HOURS = 48;
const RESTAURANTS = ['CKAY - Unit 1','CKAY - Unit 2','CKAY - Unit 3','CKAY - Unit 4','CKAY - Unit 5','CKAY - Unit 6','CKAY - Unit 7'];
const RUNS = ['Tuesday Run', 'Friday Run'];
const COOLERS = ['Cooler A', 'Cooler B'];
const FEED_TYPES = ['Starter Crumble (45% protein)', 'Grower Pellet (35% protein)', 'Finisher Pellet (28% protein)', 'Medicated Feed', 'Other'];
const LOGIN_PIN = '1234';
const ROLES = [
  { key: 'worker',  label: 'Ranch Worker',  desc: 'Daily floor work — check, feed, move, harvest' },
  { key: 'manager', label: 'Ranch Manager', desc: 'Floor work + facility overview + activity log' },
  { key: 'founder',  label: 'Founder',       desc: 'Everything, plus Google Sheet sync settings' },
];

const SEED_TANKS = [
  { id: 'T-Fingerling-1', species: 'Tilapia', cohortId: 'TIL-2026-W33', fishCount: 564, avgWt: 0.05, feedSinceSample: 12, lastSampleAt: iso(-6) },
  { id: 'T-Fingerling-2', species: 'Tilapia', cohortId: 'TIL-2026-W27', fishCount: 564, avgWt: 0.11, feedSinceSample: 18, lastSampleAt: iso(-8) },
  { id: 'T-Juvenile-1',   species: 'Tilapia', cohortId: 'TIL-2026-W21', fishCount: 564, avgWt: 0.30, feedSinceSample: 34, lastSampleAt: iso(-5) },
  { id: 'T-Juvenile-2',   species: 'Tilapia', cohortId: 'TIL-2026-W15', fishCount: 564, avgWt: 0.55, feedSinceSample: 41, lastSampleAt: iso(-9) },
  { id: 'T-GrowOut-1',    species: 'Tilapia', cohortId: 'TIL-2026-W09', fishCount: 362, avgWt: 1.10, feedSinceSample: 58, lastSampleAt: iso(-4) },
  { id: 'T-GrowOut-2',    species: 'Tilapia', cohortId: 'TIL-2026-W06', fishCount: 362, avgWt: 1.60, feedSinceSample: 63, lastSampleAt: iso(-11) },
  { id: 'T-GrowOut-3',    species: 'Tilapia', cohortId: 'TIL-2026-W03', fishCount: 362, avgWt: 2.00, feedSinceSample: 20, lastSampleAt: iso(-2) },
  { id: 'C-Fingerling-1', species: 'Catfish', cohortId: 'CAT-2026-W28', fishCount: 656, avgWt: 0.08, feedSinceSample: 15, lastSampleAt: iso(-7) },
  { id: 'C-Raceway-1',    species: 'Catfish', cohortId: 'CAT-2026-W16', fishCount: 328, avgWt: 0.40, feedSinceSample: 29, lastSampleAt: iso(-6) },
  { id: 'C-Raceway-2',    species: 'Catfish', cohortId: 'CAT-2026-W09', fishCount: 328, avgWt: 0.99, feedSinceSample: 37, lastSampleAt: iso(-13) },
  { id: 'C-GrowOut-1',    species: 'Catfish', cohortId: 'CAT-2025-W43', fishCount: 574, avgWt: 2.10, feedSinceSample: 71, lastSampleAt: iso(-3) },
  { id: 'C-GrowOut-2',    species: 'Catfish', cohortId: 'CAT-2025-W26', fishCount: 574, avgWt: 3.00, feedSinceSample: 0,  lastSampleAt: iso(-1) },
];

function iso(daysOffset){ const d = new Date(); d.setDate(d.getDate() + daysOffset); return d.toISOString(); }

// ---------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------
let STATE = null;
let SESSION = null; // { name, role, loginAt } — in-memory only, cleared on page reload
let VIEW = { screen: 'login', homeRole: 'worker', flow: null, activityFilter: 'all', loginRole: null, loginError: '', pin: '' };
let LAST_SYNC = { at: null, ok: null, mode: 'local' };

function defaultState(){
  const tanks = SEED_TANKS.map(t => {
    const biomass = round2(t.fishCount * t.avgWt);
    return Object.assign({}, t, {
      stage: computeStage(t.species, t.avgWt), biomass, biomassAtLastSample: biomass,
      lastCheckAt: null, lastCheckLevel: null, lastCheckReasons: [],
      purging: false, purgeStartAt: null, purgeReadyAt: null, closed: false,
    });
  });
  return { tanks, totes: [], deliveries: [], activity: [], toteSeq: 1, sheetUrl: '' };
}

async function loadLocalState(){
  try {
    const res = await window.storage.get('state', true);
    if (res && res.value) { STATE = JSON.parse(res.value); return true; }
  } catch(e) {}
  STATE = defaultState();
  return false;
}

async function persist(){
  try { await window.storage.set('state', JSON.stringify(STATE), true); } catch(e) { console.error('local save failed', e); }
  if (STATE.sheetUrl) pushToSheet(STATE.sheetUrl); // best-effort, non-blocking
}

async function pushToSheet(url){
  try {
    await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ value: JSON.stringify(STATE) }) });
    LAST_SYNC = { at: new Date().toISOString(), ok: true, mode: 'sheet' };
  } catch(e) {
    LAST_SYNC = { at: new Date().toISOString(), ok: false, mode: 'sheet' };
  }
}

async function pullFromSheet(url){
  try {
    const res = await fetch(url, { method: 'GET' });
    const data = await res.json();
    if (data && data.value) {
      STATE = JSON.parse(data.value);
      LAST_SYNC = { at: new Date().toISOString(), ok: true, mode: 'sheet' };
      await window.storage.set('state', JSON.stringify(STATE), true);
      return true;
    }
    throw new Error('empty sheet value');
  } catch(e) {
    LAST_SYNC = { at: new Date().toISOString(), ok: false, mode: 'sheet' };
    return false;
  }
}

async function initialLoad(){
  const hadLocal = await loadLocalState();
  if (STATE.sheetUrl) {
    const pulled = await pullFromSheet(STATE.sheetUrl);
    if (!pulled && !hadLocal) { /* keep defaults */ }
  } else if (!hadLocal) {
    await persist();
  }
}

async function refreshState(){
  const url = STATE ? STATE.sheetUrl : '';
  if (url) { await pullFromSheet(url); }
  else { await loadLocalState(); LAST_SYNC = { at: new Date().toISOString(), ok: true, mode: 'local' }; }
  render();
}

// ---------------------------------------------------------------------
// DOMAIN LOGIC
// ---------------------------------------------------------------------
function round2(n){ return Math.round(n * 100) / 100; }
function computeStage(species, avgWt){ const bands = STAGE_BANDS[species]; for (const b of bands) if (avgWt >= b.min && avgWt < b.max) return b.stage; return bands[bands.length-1].stage; }
function waterAlert(species, DO, temp, TAN, nitrite){
  const reasons = []; let level = 'ok';
  if (DO < 4.0) { reasons.push('DO below 4.0 mg/L — start auxiliary oxygen'); level = 'red'; }
  const band = TEMP_BAND[species];
  if (temp < band[0] || temp > band[1]) { reasons.push(`Temp outside ${band[0]}–${band[1]}°F band`); if (level !== 'red') level = 'amber'; }
  if (TAN > 0.25) { reasons.push('TAN above 0.25 ppm'); level = 'red'; }
  if (nitrite > 0.25) { reasons.push('Nitrite above 0.25 ppm'); level = 'red'; }
  return { level, reasons };
}
function fcrStatus(species, fcr){ const [lo,hi] = FCR_TARGET[species]; if (fcr < lo) return 'amber'; if (fcr > hi) return 'red'; return 'ok'; }
function daysSince(iso){ if (!iso) return Infinity; return (Date.now() - new Date(iso).getTime()) / 86400000; }
function hoursSince(iso){ if (!iso) return Infinity; return (Date.now() - new Date(iso).getTime()) / 3600000; }
function isToday(iso){ if (!iso) return false; const d = new Date(iso), n = new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate(); }
function timeAgo(ts){
  const mins = Math.floor((Date.now() - new Date(ts).getTime())/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return `${hrs}h ago`;
  return new Date(ts).toLocaleDateString();
}

function logActivity(type, refId, summary, level){
  const actor = SESSION ? { name: SESSION.name, role: SESSION.role } : { name: 'System', role: 'system' };
  STATE.activity.unshift({ id: 'A'+Date.now()+Math.floor(Math.random()*1000), ts: new Date().toISOString(), type, refId, summary, level: level||'ok', actor });
  if (STATE.activity.length > 400) STATE.activity.length = 400;
}

function openTanks(){ return STATE.tanks.filter(t => !t.closed); }
function findTank(id){ return STATE.tanks.find(t => t.id === id); }
function findTote(id){ return STATE.totes.find(t => t.id === id); }
function nextToteId(species){
  const d = new Date();
  const wk = String(Math.ceil((((d - new Date(d.getFullYear(),0,1)) / 86400000) + new Date(d.getFullYear(),0,1).getDay()+1) / 7)).padStart(2,'0');
  const id = `TOTE-${d.getFullYear()}-W${wk}-${String(STATE.toteSeq).padStart(3,'0')}`;
  STATE.toteSeq += 1;
  return id;
}

// ---------------------------------------------------------------------
// RENDER SHELL
// ---------------------------------------------------------------------
const bodyEl = () => document.getElementById('fo-body');
const headerEl = () => document.getElementById('fo-header');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function roleLabel(role){ const r = ROLES.find(r=>r.key===role); return r ? r.label : role; }

function renderHeader(){
  if (VIEW.screen === 'login') {
    headerEl().innerHTML = `<div class="fo-header-top"><div><div class="fo-title">Ngapori FISH OS</div><div class="fo-sub">Sign in to continue</div></div></div>`;
    return;
  }
  const canToggleRole = SESSION.role === 'manager' || SESSION.role === 'founder';

  let icons = `<button class="fo-icon-btn" id="fo-refresh" title="Refresh">⟳</button>`;

  icons += `<button class="fo-icon-btn" id="fo-logout" title="Log out">⏻</button>`;

  let row2 = '';
  if (showBack) {
    row2 = `<div class="fo-header-row2"><button class="fo-back" id="fo-back" style="color:var(--cream);">‹ Back</button></div>`;

      <div class="fo-header-row2">

      <div class="fo-header-icons">${icons}</div>

    <div class="fo-sync-note">Signed in as <b style="color:var(--cream)">${esc(SESSION.name)}</b> · ${roleLabel(SESSION.role)} ${STATE.sheetUrl ? `· Sheet sync ${LAST_SYNC.ok===false?'⚠ offline':'✓'}` : ''}</div>
  `;
}

function bindHeaderEvents(){
  if (VIEW.screen === 'login') return;
  const back = document.getElementById('fo-back'); if (back) back.addEventListener('click', goHome);
  const refresh = document.getElementById('fo-refresh'); if (refresh) refresh.addEventListener('click', async () => { await refreshState(); });
  const activity = document.getElementById('fo-activity'); if (activity) activity.addEventListener('click', () => { VIEW.screen = 'activity'; render(); });
  const settings = document.getElementById('fo-settings'); if (settings) settings.addEventListener('click', () => { VIEW.screen = 'settings'; render(); });
  const logout = document.getElementById('fo-logout'); if (logout) logout.addEventListener('click', doLogout);
  const vw = document.getElementById('fo-view-worker'); if (vw) vw.addEventListener('click', () => { VIEW.homeRole = 'worker'; render(); });
  const vm = document.getElementById('fo-view-manager'); if (vm) vm.addEventListener('click', () => { VIEW.homeRole = 'manager'; render(); });
}

function goHome(){ VIEW.screen = 'home'; VIEW.flow = null; render(); }

function doLogout(){
  logActivity('logout', SESSION.name, `${SESSION.name} logged out`, 'ok');
  persist();
  SESSION = null;
  VIEW = { screen: 'login', homeRole: 'worker', flow: null, activityFilter: 'all', loginRole: null, loginError: '', pin: '' };
  render();
}

function render(){
  renderHeader();
  if (VIEW.screen === 'login') bodyEl().innerHTML = renderLogin();
  else if (VIEW.screen === 'home') bodyEl().innerHTML = VIEW.homeRole === 'worker' ? renderWorkerHome() : renderManagerHome();
  else if (VIEW.screen === 'flow') bodyEl().innerHTML = renderFlow();
  else if (VIEW.screen === 'activity') bodyEl().innerHTML = renderActivity();
  else if (VIEW.screen === 'settings') bodyEl().innerHTML = renderSettings();
  bindHeaderEvents();
  if (VIEW.screen === 'login') bindLoginEvents();
  else if (VIEW.screen === 'home') bindHomeEvents();
  else if (VIEW.screen === 'flow') bindFlowEvents();
  else if (VIEW.screen === 'activity') bindActivityEvents();
  else if (VIEW.screen === 'settings') bindSettingsEvents();
}

function renderLogin(){
  if (!VIEW.loginRole) {
    let html = `<div class="fo-login-wrap"><div class="fo-login-title">Ngapori FISH OS</div><div class="fo-login-sub">Select your role to sign in</div><div class="fo-role-cards">`;
    ROLES.forEach(r => {
      html += `<button class="fo-role-card" data-role="${r.key}"><span class="fo-role-name">${r.label}</span><span class="fo-role-desc">${r.desc}</span></button>`;
    });
    html += `</div></div>`;
    return html;
  }
  const role = ROLES.find(r=>r.key===VIEW.loginRole);
  const dots = [0,1,2,3].map(i => `<span class="fo-pin-dot ${i < VIEW.pin.length ? 'filled':''}"></span>`).join('');
  return `
    <div class="fo-login-wrap">
      <div class="fo-login-title">${role.label}</div>
      <div class="fo-login-sub">Enter your name and PIN</div>
      <div class="fo-field"><label>Your name</label><input id="fo-login-name" placeholder="e.g. Mele Tupou"></div>
      <div class="fo-field"><label>PIN</label><input id="fo-login-pin" type="tel" inputmode="numeric" maxlength="4" placeholder="4-digit PIN"></div>
      <div class="fo-pin-dots">${dots}</div>
      ${VIEW.loginError ? `<div class="fo-login-error">${esc(VIEW.loginError)}</div>` : ''}
      <button class="fo-submit" id="fo-login-submit">Sign in</button>
      <button class="fo-submit ghost" id="fo-login-back" style="margin-top:10px;">‹ Choose a different role</button>
    </div>
  `;
}

function bindLoginEvents(){
  document.querySelectorAll('[data-role]').forEach(el => {
    el.addEventListener('click', () => { VIEW.loginRole = el.getAttribute('data-role'); VIEW.loginError=''; VIEW.pin=''; render(); });
  });
  const back = document.getElementById('fo-login-back');
  if (back) back.addEventListener('click', () => { VIEW.loginRole = null; render(); });
  const pinInput = document.getElementById('fo-login-pin');
  if (pinInput) {
    pinInput.addEventListener('input', (e) => { VIEW.pin = e.target.value.replace(/\D/g,'').slice(0,4); e.target.value = VIEW.pin; renderPinDotsOnly(); });
  }
  const submit = document.getElementById('fo-login-submit');
  if (submit) submit.addEventListener('click', attemptLogin);
}

function renderPinDotsOnly(){
  const dotsWrap = document.querySelector('.fo-pin-dots');
  if (dotsWrap) dotsWrap.innerHTML = [0,1,2,3].map(i => `<span class="fo-pin-dot ${i < VIEW.pin.length ? 'filled':''}"></span>`).join('');
}

function attemptLogin(){
  const name = (document.getElementById('fo-login-name').value || '').trim();
  const pin = (document.getElementById('fo-login-pin').value || '').trim();
  if (!name) { VIEW.loginError = 'Enter your name.'; render(); return; }
  if (pin !== LOGIN_PIN) { VIEW.loginError = 'Incorrect PIN.'; VIEW.pin=''; render(); return; }
  SESSION = { name, role: VIEW.loginRole, loginAt: new Date().toISOString() };
  VIEW = { screen: 'home', homeRole: VIEW.loginRole === 'worker' ? 'worker' : 'manager', flow: null, activityFilter: 'all', loginRole: null, loginError: '', pin: '' };
  logActivity('login', name, `${name} signed in as ${roleLabel(SESSION.role)}`, 'ok');
  persist();
  render();
}

const ACTIONS = [
  { key: 'check',   num: 1, verb: 'CHECK',   desc: 'Water + fish' },
  { key: 'feed',    num: 2, verb: 'FEED',    desc: 'Log feed given' },
  { key: 'grow',    num: 3, verb: 'GROW',    desc: 'Sample & weigh' },
  { key: 'move',    num: 4, verb: 'MOVE',    desc: 'Transfer tanks' },
  { key: 'purge',   num: 5, verb: 'PURGE',   desc: 'Start purge' },
  { key: 'harvest', num: 6, verb: 'HARVEST', desc: 'Process & tote' },
  { key: 'store',   num: 7, verb: 'STORE',   desc: 'Cooler intake' },
  { key: 'deliver', num: 8, verb: 'DELIVER', desc: 'Load & drop off' },
];

function tileMeta(key){
  const tanks = openTanks();
  if (key === 'check') { const done = tanks.filter(t=>isToday(t.lastCheckAt)).length; const flagged = tanks.filter(t=>isToday(t.lastCheckAt)&&t.lastCheckLevel!=='ok').length; return { meta:`${done}/${tanks.length} tanks today`, badge: flagged?'red':null }; }
  if (key === 'feed') { const done = STATE.activity.filter(a=>(a.type==='feed'||a.type==='check')&&isToday(a.ts)).length; return { meta:`${done} logged today`, badge:null }; }
  if (key === 'grow') { const due = tanks.filter(t=>daysSince(t.lastSampleAt)>=14).length; return { meta:`${due} due for sampling`, badge: due?'amber':null }; }
  if (key === 'move') { const done = STATE.activity.filter(a=>a.type==='move'&&isToday(a.ts)).length; return { meta:`${done} transfers today`, badge:null }; }
  if (key === 'purge') { const ready = tanks.filter(t=>t.stage==='Harvest Ready'&&!t.purging).length; return { meta:`${ready} ready to purge`, badge: ready?'amber':null }; }
  if (key === 'harvest') { const ready = tanks.filter(t=>t.purging&&hoursSince(t.purgeStartAt)>=PURGE_HOURS).length; return { meta:`${ready} harvest ready`, badge: ready?'amber':null }; }
  if (key === 'store') { const pending = STATE.totes.filter(t=>t.status==='Harvested').length; return { meta:`${pending} awaiting cooler`, badge: pending?'amber':null }; }
  if (key === 'deliver') { const pending = STATE.totes.filter(t=>t.status==='In Cooler'||t.status==='Loaded').length; return { meta:`${pending} ready to move`, badge:null }; }
  return { meta:'', badge:null };
}

function renderWorkerHome(){
  let html = `<div class="fo-section-label">Today's work</div><div class="fo-grid">`;
  for (const a of ACTIONS) {
    const m = tileMeta(a.key);
    html += `<button class="fo-tile" data-action="${a.key}">${m.badge?`<span class="fo-badge ${m.badge}"></span>`:''}<span class="fo-tile-num">${a.num}</span><span class="fo-tile-verb">${a.verb}</span><span class="fo-tile-meta">${m.meta}</span></button>`;
  }
  html += `</div>`;
  return html;
}

function bindHomeEvents(){
  document.querySelectorAll('.fo-tile[data-action]').forEach(el => el.addEventListener('click', () => openFlow(el.getAttribute('data-action'))));
}

// FLOW ENGINE
// ---------------------------------------------------------------------
const FLOW_META = {
  check:   { title: 'Check', doText: 'Inspect the tank. Check dissolved oxygen, temperature, pH, ammonia (TAN), nitrite, and mortalities since the last check.' },
  feed:    { title: 'Feed',  doText: 'Give the scheduled feed for this tank.' },
  grow:    { title: 'Grow — Sample',  doText: 'Net a sample of fish from the tank, count them, and weigh the sample.' },
  move:    { title: 'Move',  doText: 'Net or pump fish from the source tank into the destination tank.' },
  purge:   { title: 'Purge', doText: `Move all fish into the purge tank. No feed for ${PURGE_HOURS} hours before harvest.` },
  harvest: { title: 'Harvest', doText: 'Process the harvest-ready fish and weigh the total yield.' },
  store:   { title: 'Store', doText: 'Place the tote in cold storage and confirm the cooler location and temperature.' },
  deliver: { title: 'Deliver', doText: 'Load the tote, run the delivery, and confirm the restaurant received it.' },
};

function openFlow(key){ VIEW.screen = 'flow'; VIEW.flow = { key, scanId: null, search: '', result: null }; render(); }

function scanCandidates(key){
  const tanks = openTanks();
  if (key === 'check' || key === 'feed' || key === 'grow') return tanks;
  if (key === 'move') return tanks.filter(t => !t.purging);
  if (key === 'purge') return tanks.filter(t => t.stage === 'Harvest Ready' && !t.purging);
  if (key === 'harvest') return tanks.filter(t => t.purging && hoursSince(t.purgeStartAt) >= PURGE_HOURS);
  if (key === 'store') return STATE.totes.filter(t => t.status === 'Harvested');
  if (key === 'deliver') return STATE.totes.filter(t => t.status === 'In Cooler' || t.status === 'Loaded');
  return [];
}
function scanLabel(key){ return (key === 'store' || key === 'deliver') ? 'Scan tote' : 'Scan tank'; }

function renderScanItem(key, item){
  const search = (VIEW.flow.search || '').toLowerCase();
  let idField = item.id, detail = '', statusPill = '';
  if (item.hasOwnProperty('fishCount')) {
    detail = `${item.species} · ${item.stage} · ${item.fishCount} fish · ${item.biomass} lb`;
    if (key === 'check' && isToday(item.lastCheckAt)) statusPill = `<span class="fo-pill ${item.lastCheckLevel}">Checked</span>`;
    else if (key === 'purge') statusPill = `<span class="fo-pill amber">Ready</span>`;
    else if (key === 'harvest') statusPill = `<span class="fo-pill amber">Purged</span>`;
  } else {
    detail = `${item.species} · ${item.totalLbs} lb · ${item.status}`;
    statusPill = `<span class="fo-pill neutral">${item.status}</span>`;
  }
  if (search && !idField.toLowerCase().includes(search) && !(item.cohortId||'').toLowerCase().includes(search)) return '';
  const sel = VIEW.flow.scanId === idField ? 'selected' : '';
  return `<button class="fo-scan-item ${sel}" data-scan="${esc(idField)}"><span><div class="fo-scan-id mono">${esc(idField)}</div><div class="fo-scan-detail">${esc(detail)}</div></span>${statusPill}</button>`;
}

function renderFlow(){
  const key = VIEW.flow.key, meta = FLOW_META[key];
  if (VIEW.flow.result) return renderFlowResult();
  const candidates = scanCandidates(key);
  const scanItemsHtml = candidates.map(c => renderScanItem(key, c)).join('') || `<div class="fo-empty">Nothing here right now.</div>`;
  const scanned = VIEW.flow.scanId ? (key==='store'||key==='deliver' ? findTote(VIEW.flow.scanId) : findTank(VIEW.flow.scanId)) : null;
  let recordHtml = scanned ? renderRecordSection(key, scanned) : '';
  return `
    <div class="fo-flow-title" style="margin-bottom:4px;">${meta.title}</div>
    <div class="fo-step">
      <div class="fo-step-label"><span class="fo-step-num">1</span><span class="fo-step-name">${scanLabel(key)}</span></div>
      <input class="fo-scan-search" placeholder="Search ID or cohort…" id="fo-search" value="${esc(VIEW.flow.search||'')}" />
      <div class="fo-scan-list">${scanItemsHtml}</div>
    </div>
    ${scanned ? `
    <div class="fo-step">
      <div class="fo-step-label"><span class="fo-step-num">2</span><span class="fo-step-name">Do</span></div>
      <div class="fo-step-hint">${meta.doText}</div>
    </div>
    <div class="fo-step">
      <div class="fo-step-label"><span class="fo-step-num">3</span><span class="fo-step-name">Record</span></div>
      ${recordHtml}
    </div>` : ''}
  `;
}

function renderRecordSection(key, item){
  if (key === 'check') return `
      <div class="fo-field-row"><div class="fo-field"><label>DO (mg/L)</label><input type="number" step="0.1" id="f-do" placeholder="e.g. 5.5"></div><div class="fo-field"><label>Temp (°F)</label><input type="number" step="0.1" id="f-temp" placeholder="e.g. 81"></div></div>
      <div class="fo-field-row"><div class="fo-field"><label>pH</label><input type="number" step="0.1" id="f-ph" placeholder="e.g. 7.1"></div><div class="fo-field"><label>TAN (ppm)</label><input type="number" step="0.01" id="f-tan" placeholder="0"></div></div>
      <div class="fo-field-row"><div class="fo-field"><label>Nitrite (ppm)</label><input type="number" step="0.01" id="f-nitrite" placeholder="0"></div><div class="fo-field"><label>Mortalities</label><input type="number" step="1" id="f-mort" placeholder="0"></div></div>
      <div class="fo-field-row"><div class="fo-field"><label>Feed type</label><select id="f-feedtype">${FEED_TYPES.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('')}</select></div><div class="fo-field"><label>Feed given (lbs)</label><input type="number" step="0.1" id="f-feed" placeholder="0"></div></div>
      <button class="fo-submit" id="fo-submit">Submit check</button>`;
  if (key === 'feed') return `<div class="fo-field"><label>Feed type</label><select id="f-feedtype">${FEED_TYPES.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('')}</select></div><div class="fo-field"><label>Feed given (lbs)</label><input type="number" step="0.1" id="f-feed" placeholder="e.g. 24"></div><button class="fo-submit" id="fo-submit">Submit feed</button>`;
  if (key === 'grow') return `
      <div class="fo-field-row"><div class="fo-field"><label>Sample size (fish)</label><input type="number" step="1" id="f-size" placeholder="e.g. 25"></div><div class="fo-field"><label>Sample total wt (lbs)</label><input type="number" step="0.1" id="f-wt" placeholder="e.g. 42.5"></div></div>
      <div class="fo-step-hint" style="margin-top:-4px;margin-bottom:12px;">Target FCR band: ${FCR_TARGET[item.species][0]}–${FCR_TARGET[item.species][1]} for ${item.species} · Feed logged since last sample: ${item.feedSinceSample} lbs</div>
      <button class="fo-submit" id="fo-submit">Submit sample</button>`;
  if (key === 'move') {
    const others = openTanks().filter(t => t.id !== item.id);
    const opts = others.map(t => `<option value="${esc(t.id)}">${esc(t.id)} — ${t.species} ${t.stage}</option>`).join('');
    return `<div class="fo-field"><label>Destination tank</label><select id="f-dest"><option value="">Select destination…</option>${opts}<option value="__new__">+ New tank ID</option></select></div>
      <div class="fo-field" id="f-newid-wrap" style="display:none;"><label>New tank ID</label><input id="f-newid" placeholder="e.g. T-GrowOut-4"></div>
      <div class="fo-field"><label>Quantity (max ${item.fishCount})</label><input type="number" step="1" id="f-qty" placeholder="e.g. 100"></div>
      <button class="fo-submit" id="fo-submit">Submit move</button>`;
  }
  if (key === 'purge') return `<div class="fo-step-hint" style="margin-top:-4px;margin-bottom:12px;">This tank is Harvest Ready. Confirming starts a ${PURGE_HOURS}-hour purge — no feed until it's done.</div><button class="fo-submit" id="fo-submit">Confirm purge start</button>`;
  if (key === 'harvest') return `
      <div class="fo-field-row"><div class="fo-field"><label>Fish count</label><input type="number" step="1" id="f-count" value="${item.fishCount}"></div><div class="fo-field"><label>Total weight (lbs)</label><input type="number" step="0.1" id="f-wt" placeholder="e.g. ${round2(item.fishCount*item.avgWt)}"></div></div>
      <div class="fo-step-hint" style="margin-top:-4px;margin-bottom:12px;">A tote ID will be generated on submit.</div>
      <button class="fo-submit" id="fo-submit">Submit harvest</button>`;
  if (key === 'store') { const opts = COOLERS.map(c=>`<option value="${c}">${c}</option>`).join(''); return `<div class="fo-field-row"><div class="fo-field"><label>Cooler location</label><select id="f-cooler">${opts}</select></div><div class="fo-field"><label>Temp (°F)</label><input type="number" step="0.1" id="f-ctemp" placeholder="e.g. 34"></div></div><button class="fo-submit" id="fo-submit">Submit storage</button>`; }
  if (key === 'deliver') {
    const status = item.status;
    let nextLabel = status === 'In Cooler' ? 'Load truck' : status === 'Loaded' ? 'Mark delivered' : 'Confirm receipt';
    let selectorsHtml = status === 'In Cooler' ? `<div class="fo-field-row"><div class="fo-field"><label>Restaurant unit</label><select id="f-restaurant">${RESTAURANTS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')}</select></div><div class="fo-field"><label>Dispatch run</label><select id="f-run">${RUNS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')}</select></div></div>` : '';
    return `<div class="fo-pill neutral" style="margin-bottom:10px;">Current status: ${status}</div>${selectorsHtml}<button class="fo-submit" id="fo-submit">${nextLabel}</button>`;
  }
  return '';
}

function renderFlowResult(){
  const r = VIEW.flow.result, meta = FLOW_META[VIEW.flow.key];
  return `<div class="fo-flow-title" style="margin-bottom:4px;">${meta.title}</div>
    <div class="fo-result"><div class="fo-result-icon">${r.icon}</div><div class="fo-result-title">${esc(r.title)}</div><div class="fo-result-detail">${r.detail}</div><button class="fo-submit" style="width:auto;padding:13px 26px;" id="fo-result-done">Done</button></div>`;
}

function bindFlowEvents(){
  const doneBtn = document.getElementById('fo-result-done'); if (doneBtn) doneBtn.addEventListener('click', goHome);
  const search = document.getElementById('fo-search');
  if (search) search.addEventListener('input', (e) => { VIEW.flow.search = e.target.value; render(); const s=document.getElementById('fo-search'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length);} });
  document.querySelectorAll('[data-scan]').forEach(el => el.addEventListener('click', () => { VIEW.flow.scanId = el.getAttribute('data-scan'); render(); }));
  const destSel = document.getElementById('f-dest');
  if (destSel) destSel.addEventListener('change', (e) => { document.getElementById('f-newid-wrap').style.display = e.target.value === '__new__' ? 'block' : 'none'; });
  const submit = document.getElementById('fo-submit'); if (submit) submit.addEventListener('click', handleSubmit);
}

// ---------------------------------------------------------------------
// SUBMIT HANDLERS
// ---------------------------------------------------------------------
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function numVal(id, fallback){ const v = parseFloat(val(id)); return isNaN(v) ? (fallback||0) : v; }

function handleSubmit(){
  const key = VIEW.flow.key;
  const tank = findTank(VIEW.flow.scanId);
  const tote = findTote(VIEW.flow.scanId);

  if (key === 'check') {
    const DO=numVal('f-do'), temp=numVal('f-temp'), tan=numVal('f-tan'), nitrite=numVal('f-nitrite'), mort=numVal('f-mort'), feed=numVal('f-feed'), feedType=val('f-feedtype');
    const alert = waterAlert(tank.species, DO, temp, tan, nitrite);
    tank.lastCheckAt = new Date().toISOString(); tank.lastCheckLevel = alert.level; tank.lastCheckReasons = alert.reasons;
    tank.fishCount = Math.max(0, tank.fishCount - mort); tank.biomass = round2(tank.fishCount * tank.avgWt);
    if (feed > 0) { tank.feedSinceSample = round2(tank.feedSinceSample + feed); tank.lastFeedType = feedType; }
    logActivity('check', tank.id, `${tank.id} checked — DO ${DO}, ${temp}°F${mort?`, ${mort} mortalities`:''}${feed>0?`, fed ${feed} lbs ${feedType}`:''}`, alert.level);
    persist();
    VIEW.flow.result = alert.level === 'ok' ? { icon:'✓', title:'Logged — tank normal', detail:`${tank.id} readings are within range.` } : { icon:'⚠', title:`Logged — ${alert.level==='red'?'action needed':'watch this tank'}`, detail:`<span class="warn">${alert.reasons.join('<br>')}</span>` };
    render(); return;
  }
  if (key === 'feed') {
    const feed = numVal('f-feed'); const feedType = val('f-feedtype');
    tank.feedSinceSample = round2(tank.feedSinceSample + feed); tank.lastFeedType = feedType;
    logActivity('feed', tank.id, `${tank.id} fed ${feed} lbs ${feedType}`, 'ok'); persist();
    VIEW.flow.result = { icon:'✓', title:'Feed recorded', detail:`${feed} lbs of ${feedType} logged for ${tank.id}.` }; render(); return;
  }
  if (key === 'grow') {
    const size=numVal('f-size'), wt=numVal('f-wt'); if (size<=0||wt<=0) return;
    const avgWt = round2(wt/size); const newBiomass = round2(avgWt*tank.fishCount); const gain = newBiomass - tank.biomassAtLastSample;
    const fcr = gain > 0 ? round2(tank.feedSinceSample/gain) : null; const prevStage = tank.stage;
    tank.avgWt=avgWt; tank.biomass=newBiomass; tank.stage=computeStage(tank.species,avgWt); tank.biomassAtLastSample=newBiomass; tank.feedSinceSample=0; tank.lastSampleAt=new Date().toISOString();
    const fcrLevel = fcr===null?'ok':fcrStatus(tank.species,fcr); const stageChanged = prevStage!==tank.stage;
    logActivity('grow', tank.id, `${tank.id} sampled — avg ${avgWt} lb, FCR ${fcr===null?'n/a':fcr}${stageChanged?`, now ${tank.stage}`:''}`, stageChanged?'amber':fcrLevel);
    persist();
    VIEW.flow.result = { icon: stageChanged?'⚠':'✓', title: stageChanged?`Stage updated — now ${tank.stage}`:'Sample recorded', detail:`Avg weight ${avgWt} lb · Biomass ${newBiomass} lb${fcr!==null?` · FCR ${fcr}`:''}${stageChanged?'<br><span class="warn">Tank location may need to change.</span>':''}` };
    render(); return;
  }
  if (key === 'move') {
    let destId = val('f-dest'); if (destId === '__new__') destId = val('f-newid').trim();
    const qty = numVal('f-qty'); if (!destId || qty<=0 || qty>tank.fishCount) return;
    tank.fishCount -= qty; tank.biomass = round2(tank.fishCount*tank.avgWt); if (tank.fishCount===0) tank.closed=true;
    let dest = findTank(destId);
    if (dest) { const totalFish = dest.fishCount+qty; dest.avgWt = round2(((dest.avgWt*dest.fishCount)+(tank.avgWt*qty))/totalFish); dest.fishCount=totalFish; dest.biomass=round2(dest.fishCount*dest.avgWt); dest.stage=computeStage(dest.species,dest.avgWt); }
    else { dest = { id:destId, species:tank.species, cohortId:tank.cohortId, fishCount:qty, avgWt:tank.avgWt, feedSinceSample:0, lastSampleAt:tank.lastSampleAt, stage:computeStage(tank.species,tank.avgWt), biomass:round2(qty*tank.avgWt), biomassAtLastSample:round2(qty*tank.avgWt), lastCheckAt:null, lastCheckLevel:null, lastCheckReasons:[], purging:false, purgeStartAt:null, purgeReadyAt:null, closed:false }; STATE.tanks.push(dest); }
    logActivity('move', tank.id, `${qty} fish moved from ${tank.id} to ${destId}`, 'ok'); persist();
    VIEW.flow.result = { icon:'✓', title:'Move recorded', detail:`${qty} fish moved to ${destId}.` }; render(); return;
  }
  if (key === 'purge') {
    tank.purging = true; tank.purgeStartAt = new Date().toISOString();
    logActivity('purge', tank.id, `${tank.id} purge started`, 'amber'); persist();
    VIEW.flow.result = { icon:'✓', title:'Purge started', detail:`${tank.id} will be harvest-ready in ${PURGE_HOURS} hours.` }; render(); return;
  }
  if (key === 'harvest') {
    const count = numVal('f-count', tank.fishCount); const wt = numVal('f-wt'); if (wt<=0) return;
    const id = nextToteId(tank.species);
    STATE.totes.push({ id, species:tank.species, cohortId:tank.cohortId, fishCount:count, totalLbs:round2(wt), status:'Harvested', createdAt:new Date().toISOString() });
    tank.fishCount = Math.max(0, tank.fishCount-count); tank.biomass = round2(tank.fishCount*tank.avgWt);
    if (tank.fishCount===0) { tank.closed=true; tank.purging=false; }
    logActivity('harvest', tank.id, `${tank.id} harvested — tote ${id}, ${wt} lbs`, 'ok'); persist();
    VIEW.flow.result = { icon:'✓', title:'Harvest recorded', detail:`Tote <b>${id}</b> created — ${wt} lbs, ${count} fish.` }; render(); return;
  }
  if (key === 'store') {
    const cooler = val('f-cooler'), temp = numVal('f-ctemp');
    tote.status='In Cooler'; tote.coolerLoc=cooler; tote.coolerTemp=temp; tote.storedAt=new Date().toISOString();
    const outOfRange = temp<32||temp>36;
    logActivity('store', tote.id, `${tote.id} stored in ${cooler} at ${temp}°F`, outOfRange?'amber':'ok'); persist();
    VIEW.flow.result = outOfRange ? { icon:'⚠', title:'Stored — temp out of range', detail:`<span class="warn">${temp}°F is outside 32–36°F target.</span>` } : { icon:'✓', title:'Storage recorded', detail:`${tote.id} in ${cooler} at ${temp}°F.` };
    render(); return;
  }
  if (key === 'deliver') {
    if (tote.status === 'In Cooler') { tote.restaurant=val('f-restaurant'); tote.run=val('f-run'); tote.status='Loaded'; logActivity('deliver', tote.id, `${tote.id} loaded for ${tote.restaurant} (${tote.run})`, 'ok'); VIEW.flow.result = { icon:'✓', title:'Loaded', detail:`${tote.id} loaded for ${tote.restaurant}.` }; }
    else if (tote.status === 'Loaded') { tote.status='Delivered'; tote.deliveredAt=new Date().toISOString(); logActivity('deliver', tote.id, `${tote.id} delivered to ${tote.restaurant}`, 'ok'); VIEW.flow.result = { icon:'✓', title:'Delivered', detail:`${tote.id} delivered to ${tote.restaurant}. Awaiting chef confirmation.` }; }
    else { tote.status='Received'; tote.receivedAt=new Date().toISOString(); logActivity('deliver', tote.id, `${tote.id} receipt confirmed by ${tote.restaurant}`, 'ok'); VIEW.flow.result = { icon:'✓', title:'Receipt confirmed', detail:`${tote.id} — done.` }; }
    persist(); render(); return;
  }
}

// ---------------------------------------------------------------------
// MANAGER HOME
// ---------------------------------------------------------------------
function renderManagerHome(){
  const tanks = openTanks();
  const today = new Date().toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
  const checksToday = tanks.filter(t=>isToday(t.lastCheckAt)).length;
  const feedEvents = STATE.activity.filter(a=>(a.type==='feed'||a.type==='check')&&isToday(a.ts)).length;
  const moves = STATE.activity.filter(a=>a.type==='move'&&isToday(a.ts)).length;
  const samples = STATE.activity.filter(a=>a.type==='grow'&&isToday(a.ts)).length;
  const inCooler = STATE.totes.filter(t=>t.status==='In Cooler').length;
  const loaded = STATE.totes.filter(t=>t.status==='Loaded').length;
  const delivered = STATE.totes.filter(t=>t.status==='Delivered'&&isToday(t.deliveredAt)).length;

  const exceptions = [];
  tanks.forEach(t => { if (isToday(t.lastCheckAt) && t.lastCheckLevel!=='ok') exceptions.push({level:t.lastCheckLevel,title:`${t.id} — water alert`,detail:t.lastCheckReasons.join('; ')}); else if (!isToday(t.lastCheckAt)) exceptions.push({level:'amber',title:`${t.id} — no check logged today`,detail:`${t.species} · ${t.stage}`}); });
  tanks.forEach(t => { if (daysSince(t.lastSampleAt)>=14) exceptions.push({level:'amber',title:`${t.id} — sampling overdue`,detail:`Last sampled ${Math.floor(daysSince(t.lastSampleAt))} days ago`}); });
  tanks.forEach(t => { if (t.stage==='Harvest Ready'&&!t.purging) exceptions.push({level:'amber',title:`${t.id} — ready to purge`,detail:`${t.fishCount} fish at ${t.avgWt} lb avg`}); if (t.purging&&hoursSince(t.purgeStartAt)>=PURGE_HOURS) exceptions.push({level:'amber',title:`${t.id} — harvest ready`,detail:`Purge complete, ${t.fishCount} fish waiting`}); });
  exceptions.sort((a,b)=>(a.level==='red'?0:1)-(b.level==='red'?0:1));

  const checkRows = [
    { icon: checksToday===tanks.length?'✓':'⚠', text:'Water checks', count:`${checksToday}/${tanks.length} tanks` },
    { icon:'✓', text:'Feeding', count:`${feedEvents} logged` },
    { icon:'✓', text:'Transfers', count:`${moves} today` },
    { icon: samples>0?'✓':'—', text:'Sampling', count:`${samples} today` },
  ];

  let html = `<div class="fo-mgr-date">TODAY — ${today}</div>`;
  html += `<div class="fo-section-label">Status</div><div class="fo-step" style="margin-top:0;">`;
  checkRows.forEach(r => html += `<div class="fo-check-row"><span class="fo-check-icon">${r.icon}</span><span class="fo-check-text">${r.text} <span class="fo-count">${r.count}</span></span></div>`);
  html += `</div>`;
  html += `<div class="fo-section-label">Exceptions${exceptions.length?` (${exceptions.length})`:''}</div>`;
  html += exceptions.length===0 ? `<div class="fo-empty">Nothing needs attention. 🎣</div>` : exceptions.map(e=>`<div class="fo-exception-card ${e.level}"><div class="fo-exception-title">${esc(e.title)}</div><div class="fo-exception-detail">${esc(e.detail)}</div></div>`).join('');
  html += `<div class="fo-section-label">Cold chain</div><div class="fo-step" style="margin-top:0;">`;
  html += `<div class="fo-check-row"><span class="fo-check-icon">✓</span><span class="fo-check-text">In cooler <span class="fo-count">${inCooler} totes</span></span></div>`;
  html += `<div class="fo-check-row"><span class="fo-check-icon">${loaded?'⚠':'✓'}</span><span class="fo-check-text">Loaded, in transit <span class="fo-count">${loaded} totes</span></span></div>`;
  html += `<div class="fo-check-row"><span class="fo-check-icon">✓</span><span class="fo-check-text">Delivered today <span class="fo-count">${delivered} totes</span></span></div>`;
  html += `</div>`;
  html += `<div class="fo-section-label">All tanks</div><table class="fo-tank-table"><thead><tr><th>Tank</th><th>Stage</th><th>Fish</th><th>Biomass</th><th>Check</th></tr></thead><tbody>`;
  tanks.forEach(t => { const pill = !isToday(t.lastCheckAt) ? `<span class="fo-pill amber">Due</span>` : `<span class="fo-pill ${t.lastCheckLevel}">${t.lastCheckLevel==='ok'?'OK':t.lastCheckLevel}</span>`; html += `<tr><td class="mono">${esc(t.id)}</td><td>${esc(t.stage)}</td><td>${t.fishCount}</td><td>${t.biomass} lb</td><td>${pill}</td></tr>`; });
  html += `</tbody></table>`;
  return html;
}

// ---------------------------------------------------------------------
// ACTIVITY LOG
// ---------------------------------------------------------------------
function renderActivity(){
  const canSeeAll = SESSION.role === 'manager' || SESSION.role === 'founder';
  let entries = STATE.activity;
  if (!canSeeAll) entries = entries.filter(a => a.actor && a.actor.name === SESSION.name);
  else if (VIEW.activityFilter === 'mine') entries = entries.filter(a => a.actor && a.actor.name === SESSION.name);
  let html = '';
  if (canSeeAll) html += `<div class="fo-activity-filters"><button class="fo-filter-btn ${VIEW.activityFilter==='all'?'active':''}" data-filter="all">Everyone</button><button class="fo-filter-btn ${VIEW.activityFilter==='mine'?'active':''}" data-filter="mine">Just me</button></div>`;
  if (entries.length === 0) { html += `<div class="fo-empty">No activity yet.</div>`; return html; }
  entries.slice(0, 150).forEach(a => {
    const roleClass = a.actor ? `role-${a.actor.role}` : 'neutral';
    html += `<div class="fo-activity-item"><div class="fo-activity-top"><span class="fo-activity-actor">${esc(a.actor?a.actor.name:'System')} <span class="fo-pill ${roleClass}" style="margin-left:4px;">${a.actor?roleLabel(a.actor.role):''}</span></span><span class="fo-activity-time">${timeAgo(a.ts)}</span></div><div class="fo-activity-summary">${esc(a.summary)}</div></div>`;
  });
  return html;
}
function bindActivityEvents(){
  document.querySelectorAll('[data-filter]').forEach(el => el.addEventListener('click', () => { VIEW.activityFilter = el.getAttribute('data-filter'); render(); }));
}

// ---------------------------------------------------------------------
// SETTINGS (founder only) — Google Sheet sync
// ---------------------------------------------------------------------
const APPS_SCRIPT_CODE = `function doGet(e) {
  var value = getDataSheet_().getRange('A1').getValue();
  return ContentService.createTextOutput(JSON.stringify({ value: value }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var body = JSON.parse(e.postData.contents);
  getDataSheet_().getRange('A1').setValue(body.value);
  var state = JSON.parse(body.value);
  writeTanksTab_(state);
  writeTotesTab_(state);
  writeActivityTab_(state);
  return ContentService.createTextOutput('ok');
}

// Raw JSON round-trip — this is what the app reads back on load/refresh.
function getDataSheet_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('FISHOS_DATA');
  if (!sheet) { sheet = ss.insertSheet('FISHOS_DATA'); sheet.getRange('A1').setValue('{}'); }
  return sheet;
}

// Human-readable mirror tabs — safe to open and read, don't hand-edit them.
function writeTanksTab_(state) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Tanks') || ss.insertSheet('Tanks');
  sheet.clear();
  var headers = ['Tank ID','Species','Cohort','Stage','Fish Count','Avg Wt (lb)','Biomass (lb)','Feed Since Sample (lb)','Last Feed Type','Last Check','Check Status','Last Sample','Purging','Closed'];
  var rows = state.tanks.map(function(t) {
    return [t.id, t.species, t.cohortId, t.stage, t.fishCount, t.avgWt, t.biomass, t.feedSinceSample, t.lastFeedType || '', t.lastCheckAt || '', t.lastCheckLevel || '', t.lastSampleAt || '', t.purging ? 'Yes' : 'No', t.closed ? 'Yes' : 'No'];
  });
  sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
  if (rows.length) sheet.getRange(2, 1, rows.length, headers.length).setValues(rows);
  sheet.setFrozenRows(1);
}

function writeTotesTab_(state) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Totes') || ss.insertSheet('Totes');
  sheet.clear();
  var headers = ['Tote ID','Species','Cohort','Fish Count','Total Wt (lb)','Status','Cooler','Cooler Temp','Restaurant','Run','Created','Delivered'];
  var rows = state.totes.map(function(t) {
    return [t.id, t.species, t.cohortId, t.fishCount, t.totalLbs, t.status, t.coolerLoc || '', t.coolerTemp || '', t.restaurant || '', t.run || '', t.createdAt || '', t.deliveredAt || ''];
  });
  sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
  if (rows.length) sheet.getRange(2, 1, rows.length, headers.length).setValues(rows);
  sheet.setFrozenRows(1);
}

function writeActivityTab_(state) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Activity Log') || ss.insertSheet('Activity Log');
  sheet.clear();
  var headers = ['Timestamp','Person','Role','Type','Reference','Summary','Level'];
  var rows = state.activity.map(function(a) {
    return [a.ts, a.actor ? a.actor.name : '', a.actor ? a.actor.role : '', a.type, a.refId, a.summary, a.level];
  });
  sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
  if (rows.length) sheet.getRange(2, 1, rows.length, headers.length).setValues(rows);
  sheet.setFrozenRows(1);
}`;

function renderSettings(){
  const url = STATE.sheetUrl || '';
  return `
    <div class="fo-settings-block">
      <div class="fo-settings-label">Google Sheet live sync</div>
      <div class="fo-settings-desc">FISH OS keeps its data in a Google Sheet cell via a small Apps Script bridge. Paste your deployed Web App URL below once you've set it up (steps below).</div>
      <div class="fo-field"><label>Web App URL</label><input id="fo-sheet-url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(url)}"></div>
      <button class="fo-submit" id="fo-sheet-save">Save & connect</button>
      ${url ? `<button class="fo-submit secondary" id="fo-sheet-pull" style="margin-top:8px;">Pull latest from sheet</button><button class="fo-submit ghost" id="fo-sheet-disconnect" style="margin-top:8px;">Disconnect</button>` : ''}
      ${LAST_SYNC.at ? `<div class="fo-sync-status ${LAST_SYNC.ok?'ok':'err'}">${LAST_SYNC.ok ? '✓' : '⚠'} Last sync ${timeAgo(LAST_SYNC.at)} (${LAST_SYNC.mode})</div>` : ''}
    </div>
    <div class="fo-settings-block">
      <div class="fo-settings-label">One-time setup (5 min)</div>
      <div class="fo-settings-desc">1. Open (or create) a <b>Google Sheet</b> — File → Save as Google Sheets first if you're starting from an uploaded .xlsx.<br>2. Extensions → Apps Script.<br>3. Select all the placeholder code and delete it, paste the script below in its place.<br>4. Deploy → New deployment → type "Web app" → Execute as "Me" → Who has access "Anyone" → Deploy.<br>5. Copy the Web App URL and paste it above.</div>
      <div class="fo-settings-desc">Already deployed and just updating the script? Use <b>Deploy → Manage deployments → ✏️ edit → Version: New version → Deploy</b> — this keeps your existing URL working, no need to reconnect.</div>
      <div class="fo-code-block" id="fo-apps-script">${esc(APPS_SCRIPT_CODE)}</div>
      <button class="fo-submit ghost" id="fo-copy-script">Copy script</button>
    </div>
    <div class="fo-settings-block">
      <div class="fo-settings-label">Where the data actually shows up</div>
      <div class="fo-settings-desc">This script writes three readable tabs into your Sheet — <b>Tanks</b>, <b>Totes</b>, and <b>Activity Log</b> — rebuilt fresh on every sync, plus a hidden <b>FISHOS_DATA</b> tab the app uses to reload its own state. Open the Tanks or Activity Log tab any time to see what's changed.<br><br>Note: this only writes to whichever Google Sheet you ran Apps Script from. It does <b>not</b> write back to the original .xlsx file you uploaded to this chat — that file is static. If you want FISH OS backed by that exact workbook, upload it to Google Drive, open it (it'll convert to a native Google Sheet), and run the Apps Script setup from there.</div>
    </div>
    <div class="fo-settings-block">
      <div class="fo-settings-label">Without a sheet connected</div>
      <div class="fo-settings-desc">FISH OS already keeps every worker and manager in sync on its own built-in storage — the Google Sheet is optional and just mirrors the same data into a spreadsheet you can open directly.</div>
    </div>
  `;
}

function bindSettingsEvents(){
  const save = document.getElementById('fo-sheet-save');
  if (save) save.addEventListener('click', async () => {
    const url = (document.getElementById('fo-sheet-url').value || '').trim();
    STATE.sheetUrl = url;
    await window.storage.set('state', JSON.stringify(STATE), true);
    if (url) { const ok = await pullFromSheet(url); if (!ok) await pushToSheet(url); }
    render();
  });
  const pull = document.getElementById('fo-sheet-pull');
  if (pull) pull.addEventListener('click', async () => { await pullFromSheet(STATE.sheetUrl); render(); });
  const disconnect = document.getElementById('fo-sheet-disconnect');
  if (disconnect) disconnect.addEventListener('click', async () => { STATE.sheetUrl = ''; await window.storage.set('state', JSON.stringify(STATE), true); LAST_SYNC = { at:null, ok:null, mode:'local' }; render(); });
  const copy = document.getElementById('fo-copy-script');
  if (copy) copy.addEventListener('click', () => { try { navigator.clipboard.writeText(APPS_SCRIPT_CODE); copy.textContent = 'Copied!'; setTimeout(()=>{ copy.textContent='Copy script'; }, 1500); } catch(e){} });
}

// ---------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------
async function init(){
  await initialLoad();
  render();
}
init();

})();
